name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install

      - name: Copy the app into www
        run: npm run prepare-web

      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Use the app icon
        run: |
          cp -r android-icons/* android/app/src/main/res/
          sed -i 's/#FFFFFF/#FCE44A/' android/app/src/main/res/values/ic_launcher_background.xml

      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Learning-Zone.apk

      - name: Save the APK as a build file
        uses: actions/upload-artifact@v4
        with:
          name: Learning-Zone-apk
          path: Learning-Zone.apk

      - name: Publish the APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Learning Zone (build ${{ github.run_number }})
          body: |
            Learning Zone — Maths and English for Class 2 to 5.
            Built by Gnaneswar.
            Download Learning-Zone.apk below and open it on an Android phone to install.
          files: Learning-Zone.apk
