<html lang="en">
<head>

*{box-sizing:border-box}

<title>Learning Zone</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Baloo+Tammudu+2:wght@500;600&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: a bright schoolroom app — header with class picker + stars, subject switch, activity pills, one big activity panel */
:root{
  --bg:#EAF4FB; --surface:#FFFFFF; --surface-2:#F4F9FD; --ink:#1B2A41; --muted:#5A6B82; --line:#CFE0EE;
  --sky:#2F6FE0; --sky-soft:#DCE8FC; --mango:#F2A900; --mango-soft:#FFF1CC; --leaf:#22935A; --leaf-soft:#D8F2E3; --coral:#E2474F; --coral-soft:#FDE1E2; --plum:#7B45C4;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1B2B; --surface:#17263A; --surface-2:#1D2F46; --ink:#EAF2FB; --muted:#A3B5CB; --line:#2B4160;
  --sky:#7EA9FF; --sky-soft:#22375A; --mango:#FFC94A; --mango-soft:#3A3115; --leaf:#5BD394; --leaf-soft:#173B2A; --coral:#FF7A80; --coral-soft:#43222A; --plum:#C29BFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1B2B; --surface:#17263A; --surface-2:#1D2F46; --ink:#EAF2FB; --muted:#A3B5CB; --line:#2B4160;
  --sky:#7EA9FF; --sky-soft:#22375A; --mango:#FFC94A; --mango-soft:#3A3115; --leaf:#5BD394; --leaf-soft:#173B2A; --coral:#FF7A80; --coral-soft:#43222A; --plum:#C29BFF; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand h1{font-size:clamp(1.6rem,4.5vw,2.3rem);font-weight:800;letter-spacing:-.01em}
.brand h1 .n{color:var(--sky)} .brand h1 .a{color:var(--coral)}
.brand p{margin:0;color:var(--muted);font-weight:700}
.stars{display:flex;align-items:center;gap:6px;background:var(--mango-soft);border:2px solid var(--mango);border-radius:999px;padding:6px 14px;font-family:var(--display);font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums}
.stars svg{width:24px;height:24px;fill:var(--mango)}
.stars.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.25)}}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.seg{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.seg .lbl{font-weight:800;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;margin-right:4px}
.seg button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 14px;font-weight:800;min-width:46px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.subjects{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.subj{border:3px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 16px;text-align:left;display:flex;align-items:center;gap:12px}
.subj .big{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1;width:54px;height:54px;border-radius:14px;display:grid;place-items:center;flex:none}
.subj.m .big{background:var(--sky-soft);color:var(--sky)} .subj.e .big{background:var(--coral-soft);color:var(--coral)}
.subj b{font-family:var(--display);font-size:1.35rem;display:block;line-height:1.1} .subj small{color:var(--muted);font-weight:700}
.subj.m[aria-pressed="true"]{border-color:var(--sky)} .subj.e[aria-pressed="true"]{border-color:var(--coral)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts:not([hidden]){display:flex}
.acts button{flex:none;border:none;background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:800;color:var(--muted);box-shadow:inset 0 0 0 2px var(--line)}
.acts button[aria-pressed="true"]{background:var(--accent,var(--sky));color:#fff;box-shadow:none}
.card{background:var(--surface);border-radius:var(--r);padding:18px;border:2px solid var(--line);min-width:0;display:flex;flex-direction:column;gap:12px}
.card h2{font-size:1.5rem}
.hint{margin:0;color:var(--muted);font-weight:600}
.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.btn{border:none;border-radius:14px;padding:10px 18px;font-weight:800;background:var(--sky);color:#fff;font-size:1rem}
.btn.ghost{background:var(--sky-soft);color:var(--sky)}
.btn.leaf{background:var(--leaf)} .btn.coral{background:var(--coral)}
:root[data-theme="dark"] .btn:not(.ghost), :root:not([data-theme="light"]) .btn:not(.ghost){color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn:not(.ghost),:root:not([data-theme="light"]) .acts button[aria-pressed="true"]{color:#0F1B2B}}
:root[data-theme="dark"] .btn:not(.ghost),:root[data-theme="dark"] .acts button[aria-pressed="true"]{color:#0F1B2B}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.round{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--surface-2);font-size:1.6rem;font-weight:800;line-height:1}
#nIn{width:9ch;font-family:var(--display);font-size:1.6rem;font-weight:800;text-align:center;border:2px solid var(--line);border-radius:14px;padding:4px 8px;background:var(--surface-2);color:var(--ink)}
.bignum{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,9vw,4rem);line-height:1;color:var(--sky);font-variant-numeric:tabular-nums}
.words{font-weight:800;font-size:1.15rem;text-transform:capitalize}
.pv{display:flex;gap:6px;flex-wrap:wrap}
.pv div{flex:1 1 70px;background:var(--surface-2);border:2px solid var(--line);border-radius:14px;padding:8px;text-align:center}
.pv b{display:block;font-family:var(--display);font-size:1.8rem;line-height:1.1}
.pv span{font-size:.72rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.pv em{display:block;font-style:normal;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{border-radius:999px;padding:4px 12px;font-weight:800;font-size:.9rem}
.badge.yes{background:var(--leaf-soft);color:var(--leaf)} .badge.no{background:var(--surface-2);color:var(--muted);text-decoration:line-through}
.badge.info{background:var(--mango-soft);color:var(--ink)}
.facts{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.facts li{background:var(--surface-2);border-radius:12px;padding:8px 12px;font-weight:600}
.facts b{font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:2px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 12px;font-weight:800}
.chips button[aria-pressed="true"]{background:var(--mango);border-color:var(--mango);color:#1B2A41}
.def{margin:0;background:var(--mango-soft);border-radius:12px;padding:10px 12px;font-weight:700}
.line-scroll{overflow-x:auto;padding-bottom:6px}
.nline{display:grid;grid-template-columns:repeat(11,minmax(34px,1fr));gap:5px}
.tick{border:2px solid var(--line);background:var(--surface-2);border-radius:10px;height:40px;font-family:var(--display);font-weight:800;font-size:1.05rem;font-variant-numeric:tabular-nums}
.tick.neg{color:var(--coral)}
.tick.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.practice .question{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,6vw,2.6rem);line-height:1.2;text-align:center;padding:14px 6px;background:var(--surface-2);border-radius:14px;font-variant-numeric:tabular-nums}
.ptop{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:800;color:var(--muted)}
.qkind{margin:0;font-size:.8rem;font-weight:800;color:var(--sky);text-transform:uppercase;letter-spacing:.08em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:3px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 8px;font-family:var(--display);font-weight:800;font-size:1.5rem;font-variant-numeric:tabular-nums}
.opt:hover:not(:disabled){border-color:var(--sky)}
.opt.right{background:var(--leaf-soft);border-color:var(--leaf);color:var(--leaf)}
.opt.wrong{background:var(--coral-soft);border-color:var(--coral);color:var(--coral)}
.feedback{margin:0;min-height:1.6em;font-weight:800;font-size:1.1rem;text-align:center}
.feedback.good{color:var(--leaf)} .feedback.bad{color:var(--coral)}
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.letters button{aspect-ratio:1;max-width:100%;border:2px solid var(--line);background:var(--surface-2);border-radius:12px;font-family:var(--display);font-weight:800;font-size:1.5rem}
.letters button.vowel{color:var(--coral)}
.letters button[aria-pressed="true"]{background:var(--sky);border-color:var(--sky);color:#fff}
.lettercard{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.lettercard .glyph{font-family:var(--display);font-weight:800;font-size:4.5rem;line-height:1;color:var(--sky)}
.lettercard .glyph.vowel{color:var(--coral)}
.pic{font-size:4rem;line-height:1}
.lettercard p{margin:0}
.lettercard .w{font-family:var(--display);font-weight:800;font-size:1.8rem;line-height:1.1}
.lettercard .w u{text-decoration-thickness:3px;text-underline-offset:4px;color:var(--coral)}
.slots,.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.slot,.tile{min-width:44px;height:52px;border-radius:12px;font-family:var(--display);font-weight:800;font-size:1.6rem;padding:0 12px}
.slot{border:3px dashed var(--line);background:var(--surface-2)}
.slot.full{border-style:solid;border-color:var(--sky);background:var(--sky-soft);color:var(--sky)}
.tile{border:none;background:var(--mango);color:#1B2A41;box-shadow:0 4px 0 color-mix(in srgb,var(--mango) 60%,#000)}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--mango) 60%,#000)}
.tile:disabled{opacity:.25;box-shadow:none;cursor:default}
.sent .slot,.sent .tile{font-size:1.15rem;height:48px;font-family:var(--body)}
.sent .slot.empty{min-width:60px}
.builder.solved .slot.full{background:var(--leaf-soft);border-color:var(--leaf);color:var(--leaf)}
.builder.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.wordlist{display:flex;flex-wrap:wrap;gap:6px;max-height:190px;overflow-y:auto;padding:4px;border:2px solid var(--line);border-radius:14px}
.wordlist button{border:2px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 14px;font-weight:800}
.wordlist button[aria-pressed="true"]{background:var(--coral);border-color:var(--coral);color:#fff}
.syl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.syl button{border:none;border-radius:14px;padding:10px 16px;font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1.1}
.syl button:nth-child(4n+1){background:var(--sky-soft);color:var(--sky)}
.syl button:nth-child(4n+2){background:var(--coral-soft);color:var(--coral)}
.syl button:nth-child(4n+3){background:var(--leaf-soft);color:var(--leaf)}
.syl button:nth-child(4n){background:var(--mango-soft);color:var(--ink)}
.claps{text-align:center;font-weight:800;color:var(--muted);margin:0}
.center{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.note{font-size:.85rem;color:var(--muted);font-weight:600;margin:0}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-size:.78em;margin:0 .12em}
.fr span:first-child{border-bottom:.12em solid currentColor;padding:0 .15em .05em}
.fr span:last-child{padding:.05em .15em 0}
.why{margin:0;background:var(--sky-soft);border-radius:12px;padding:10px 12px;font-weight:700}
.practice .question.long{font-size:clamp(1.15rem,4.2vw,1.6rem)}
.tt{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.tt span{background:var(--surface-2);border-radius:10px;padding:6px 10px;font-weight:700;font-variant-numeric:tabular-nums}
.card h3{font-size:1.15rem}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:320px}
.kp button{height:56px;border-radius:14px;border:2px solid var(--line);background:var(--surface-2);font-family:var(--display);font-weight:800;font-size:1.6rem}
.kp button:active{transform:translateY(2px)}
.kp .ok{background:var(--leaf);border-color:var(--leaf);color:var(--surface)}
.kp-display{min-width:170px;font-family:var(--display);font-weight:800;font-size:2.2rem;line-height:1.2;text-align:center;border-bottom:4px solid var(--sky);margin-bottom:10px;font-variant-numeric:tabular-nums}
.timer{height:12px;width:100%;background:var(--surface-2);border-radius:999px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--leaf);transition:width 1s linear}
.flash-good{color:var(--leaf)!important}.flash-bad{color:var(--coral)!important}
.tt .cell{border:2px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 10px;font-weight:700;font-size:1.05rem;text-align:left;font-variant-numeric:tabular-nums}
.tt .cell.hid b{color:var(--coral)}
.part{fill:var(--surface-2);stroke:var(--ink);stroke-width:2;cursor:pointer}
.part.on{fill:var(--mango)}
.fshape{touch-action:manipulation}
.clock .face{fill:var(--surface);stroke:var(--ink);stroke-width:4}
.clock text{fill:var(--ink);font-family:var(--display);font-weight:800;font-size:17px;text-anchor:middle;dominant-baseline:central}
.clock .tk{stroke:var(--muted);stroke-width:1.5}.clock .tk.big{stroke:var(--ink);stroke-width:3}
.clock .hh{stroke:var(--coral);stroke-width:8;stroke-linecap:round}.clock .mh{stroke:var(--sky);stroke-width:5;stroke-linecap:round}.clock .dot{fill:var(--ink)}
.clockfig{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;color:var(--muted)}
.cash{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:6px}
.coin{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.1rem;background:var(--mango-soft);border:4px solid var(--mango);color:var(--ink)}
.note{min-width:100px;height:54px;border-radius:8px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.25rem;border:3px solid var(--line);padding:0 12px;background:var(--surface-2);color:var(--ink)}
.note.v20{background:var(--mango-soft);border-color:var(--mango)}.note.v50{background:var(--sky-soft);border-color:var(--sky)}.note.v100{background:var(--coral-soft);border-color:var(--coral)}.note.v200,.note.v500{background:var(--leaf-soft);border-color:var(--leaf)}
.ptop h2{color:var(--ink)}
.hright{display:flex;align-items:center;gap:10px}
.navbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.back{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 16px;font-weight:800;font-size:1rem}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-weight:800;color:var(--muted);min-width:0}
.crumbs button{border:none;background:none;padding:4px 6px;font-weight:800;color:var(--sky);text-decoration:underline;text-underline-offset:3px}
.crumbs [aria-current]{color:var(--ink);padding:4px 6px}
.crumbs .sep{color:var(--muted)}
.menu{display:flex;flex-direction:column;gap:12px;width:100%;max-width:560px;margin:0 auto}
.menu h2{font-size:1.5rem;margin-bottom:2px}
.mitem{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:3px solid var(--line);background:var(--surface);border-radius:20px;padding:14px 16px;min-height:80px;transition:border-color .15s,transform .15s}
.mitem:hover{border-color:var(--c);transform:translateX(3px)}
.mitem .ic{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.7rem;background:var(--cs);color:var(--c);flex:none;line-height:1}
.mitem .ic.sm{font-size:1.1rem}
.mitem .mt{min-width:0;display:flex;flex-direction:column;gap:2px}
.mitem b{font-family:var(--display);font-size:1.4rem;line-height:1.1}
.mitem small{color:var(--muted);font-weight:700;font-size:.92rem}
.mitem .chev{margin-left:auto;font-size:2rem;color:var(--c);font-weight:800;flex:none}
.zone{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.zone:not([hidden]){display:grid}
.zone button{border:3px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 14px;text-align:left;display:flex;flex-direction:column;gap:2px}
.zone b{font-family:var(--display);font-size:1.25rem;line-height:1.1}.zone small{color:var(--muted);font-weight:700}
.zone button[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-soft)}
.adv .question{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,6vw,2.2rem);text-align:center;font-variant-numeric:tabular-nums;margin-top:-6px}
.adv #advE:empty{display:none}
.advf{gap:6px}
.finp{display:inline-flex;flex-direction:column;align-items:center;gap:3px}
.finp i{display:block;width:100%;height:3px;background:var(--ink);border-radius:2px}
.finp .ninp{width:5ch;font-size:1.15rem;padding:2px 4px}
.opsign{font-size:1.35rem}
.mtabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.mtabs button{border:3px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 12px;text-align:left;display:flex;flex-direction:column}
.mtabs small{color:var(--muted);font-weight:800;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}.mtabs b{font-family:var(--display);font-size:1.1rem;line-height:1.15}
.mtabs button[aria-pressed="true"]{border-color:var(--coral);background:var(--coral-soft)}
.ninp{width:7.5ch;font-family:var(--display);font-size:1.3rem;font-weight:800;text-align:center;border:2px solid var(--line);border-radius:12px;padding:4px 6px;background:var(--surface-2);color:var(--ink)}
.opsign{font-family:var(--display);font-weight:800;font-size:1.6rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.vis{display:flex;justify-content:center;overflow-x:auto;padding:10px 4px;background:var(--surface-2);border-radius:16px;min-height:80px}
.later{visibility:hidden}
.stepbox{background:var(--surface-2);border-radius:14px;padding:12px 14px}
.steps{margin:0;padding-left:1.4em;display:grid;gap:6px}.steps li{font-weight:600}
.steps li.cur{font-weight:800;background:var(--mango-soft);border-radius:10px;padding:6px 10px}
.colg{display:inline-grid;--cw:1.15em;font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,6.5vw,2.3rem);line-height:1.3;font-variant-numeric:tabular-nums;justify-items:stretch;padding:4px 10px}

<script>
(function(){
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rand = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const fmt = n => Number(n).toLocaleString('en-IN');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function shuffleNew(a){if(a.length<2)return a.slice();let s;let tries=0;do{s=shuffle(a);tries++;}while(s.join('|')===a.join('|')&&tries<20);return s;}
function load(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

const S = { cls: load('nac-class',3), subject:'maths', act:{maths:'explore',english:'phonics'}, stars: load('nac-stars',0), sound: load('nac-sound',true),
  num: 24, filter:'even', streak:0, letter:'A', sayIdx:0, wbIdx:0, sbIdx:0 };

/* ---------- speech ---------- */
let voice=null;
function pickVoice(){ if(!('speechSynthesis' in window)) return; const vs=speechSynthesis.getVoices();
  voice = vs.find(v=>/en[-_]IN/i.test(v.lang)) || vs.find(v=>/en[-_]GB/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null; }
if('speechSynthesis' in window){ pickVoice(); try{speechSynthesis.onvoiceschanged=pickVoice;}catch(e){} }
function speak(text, rate){ if(!S.sound) return;
  const NT=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.TextToSpeech;
  if(NT){try{NT.stop().catch(()=>{});NT.speak({text:String(text),lang:'en-IN',rate:rate||0.85,pitch:1,volume:1}).catch(()=>{});}catch(e){}return;}
  if(!('speechSynthesis' in window)) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); if(voice){u.voice=voice;u.lang=voice.lang;} else u.lang='en-IN'; u.rate=rate||0.85; speechSynthesis.speak(u);}catch(e){} }
const SPK = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="vertical-align:-3px;fill:currentColor"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';

/* ---------- stars ---------- */
function addStar(){ S.stars++; save('nac-stars',S.stars); $('#starN').textContent=S.stars; const el=$('#stars'); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
$('#starN').textContent=S.stars;
const PRAISE=['Super!','Well done!','Correct!','Great job!','You got it!','Brilliant!'];

/* ---------- numbers helpers ---------- */
const ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function under100(n){return n<20?ONES[n]:TENS[Math.floor(n/10)]+(n%10?'-'+ONES[n%10]:'');}
function under1000(n){const h=Math.floor(n/100),r=n%100,p=[];if(h)p.push(ONES[h]+' hundred');if(r)p.push(under100(r));return p.join(' and ');}
function words(n){if(n===0)return 'zero';const l=Math.floor(n/100000),t=Math.floor(n%100000/1000),r=n%1000,p=[];
  if(l)p.push(under100(l)+' lakh');if(t)p.push(under100(t)+' thousand');if(r)p.push(((l||t)&&r<100?'and ':'')+under1000(r));return p.join(' ');}
function isPrime(n){if(n<2)return false;for(let i=2;i*i<=n;i++)if(n%i===0)return false;return true;}
function isSquare(n){const r=Math.round(Math.sqrt(n));return r*r===n;}
function roman(n){if(n<1||n>3999)return null;const m=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let s='';for(const [v,c] of m){while(n>=v){s+=c;n-=v;}}return s;}
function factors(n){const f=[];for(let i=1;i*i<=n;i++)if(n%i===0){f.push(i);if(i*i!==n)f.push(n/i);}return f.sort((a,b)=>a-b);}
const gcd=(a,b)=>b?gcd(b,a%b):a; const lcm=(a,b)=>a/gcd(a,b)*b;
const roundTo=(n,p)=>Math.round(n/p)*p;

/* ---------- MATHS: practice generators ---------- */
const LABEL={add:'Addition',sub:'Subtraction',mul:'Multiplication',div:'Division',frac:'Fractions',dec:'Decimals',percent:'Percentages',bodmas:'Brackets and order',factors:'Factors and multiples',measure:'Perimeter and area',place:'Place value',round:'Rounding',roman:'Roman numerals',compare:'Compare',order:'Number order',pattern:'Patterns',types:'Kinds of numbers'};
const TOPICS={2:['add','sub','mul','div','frac','place','compare','order','pattern','types'],
  3:['add','sub','mul','div','frac','place','compare','order','pattern','roman','types'],
  4:['add','sub','mul','div','frac','dec','place','round','roman','factors','measure','types'],
  5:['add','sub','mul','div','frac','dec','percent','bodmas','factors','measure','place','round','pattern']};
const N=x=>String(+(+x).toFixed(4));
function numOpts(ans,spread,wrongs){ans=+ans;const set=new Set([N(ans)]);
  for(const w of shuffle(wrongs||[])){if(set.size>=4)break;if(w>=0&&N(w)!==N(ans))set.add(N(w));}
  const sp=Math.max(1,Math.round(spread||10));
  for(const o of shuffle([1,2,-1,-2,sp,-sp,2*sp,10,-10])){if(set.size>=4)break;const v=ans+o;if(v>=0)set.add(N(v));}
  let k=3;while(set.size<4)set.add(N(ans+k++));return shuffle([...set]);}
function decOpts(ans){ans=+ans;const set=new Set([N(ans)]);
  for(const c of shuffle([ans+0.1,ans-0.1,ans+1,ans-1,ans*10,ans/10,ans+0.01,ans-0.01])){if(set.size>=4)break;if(c>=0)set.add(N(c));}
  let k=2;while(set.size<4)set.add(N(ans+k++));return shuffle([...set]);}
function fr(n,d){const g=gcd(n,d);n/=g;d/=g;return d===1?String(n):n+'/'+d;}
function frOpts(n,d,extra){const ans=fr(n,d),set=new Set([ans]);
  for(const [a,b] of shuffle((extra||[]).concat([[n+1,d],[n-1,d],[n,d+1],[n+d,d],[d,n],[n*2,d*3],[n,d*2]]))){
    if(set.size>=4)break;if(a>0&&b>0&&Math.abs(a/b-n/d)>1e-9)set.add(fr(a,b));}
  let k=2;while(set.size<4){set.add(fr(n+k*d,d));k++;}return shuffle([...set]);}
function strOpts(ans,cands){const set=new Set([ans]);for(const c of cands){if(set.size>=4)break;if(c!=null)set.add(c);}return shuffle([...set]);}
function remOpts(r,b){const pool=[];for(let i=0;i<=b+1;i++)if(i!==r)pool.push(String(i));return shuffle([String(r)].concat(shuffle(pool).slice(0,3)));}
function distinctDigits(len){const ds=shuffle([1,2,3,4,5,6,7,8,9]).slice(0,len);return ds;}
const PLACES=['Ones','Tens','Hundreds','Thousands','Ten thousands','Lakhs'];
function placeQ(len){const ds=distinctDigits(len),n=+ds.join(''),i=rand(0,len-1),p=len-1-i,ans=ds[i]*10**p;
  const o=new Set([N(ans)]);for(const q of shuffle([...Array(len+1).keys()])){if(o.size>=4)break;if(q!==p)o.add(N(ds[i]*10**q));}

  if(c===2){const s=pick([2,5,10]),a=rand(0,20);t=[0,1,2,3].map(i=>a+i*s);ans=a+4*s;why=`Each time add ${s}.`;}

  else if(c===4){if(r<.5){const s=pick([6,7,8,9,11,12,15,250,500]),a=rand(0,10)*s;t=[0,1,2,3].map(i=>a+i*s);ans=a+4*s;why=`Each time add ${s}.`;}
    else if(r<.75){const a=rand(1,5);t=[a,a*2,a*4,a*8];ans=a*16;why='Each number is double the one before.';}
    else {const s=pick([9,11,25]),a=s*rand(10,20);t=[0,1,2,3].map(i=>a-i*s);ans=a-4*s;why=`Each time take away ${s}.`;}}
  else {if(r<.3){const a=rand(1,4);t=[a,a*3,a*9,a*27];ans=a*81;why='Each number is 3 times the one before.';}
    else if(r<.55){const k=rand(1,6);t=[k,k+1,k+2,k+3].map(x=>x*x);ans=(k+4)**2;why=`Square numbers: ${k}×${k}, ${k+1}×${k+1} … next is ${k+4}×${k+4} = ${ans}.`;}
    else if(r<.8){const s=pick([0.5,0.25,0.2]),a=rand(1,9);t=[0,1,2,3].map(i=>N(a+i*s));ans=+N(a+4*s);why=`Each time add ${s}.`;dec=true;}
    else {const s=pick([1250,2500,5000]),a=s*rand(1,8);t=[0,1,2,3].map(i=>a+i*s);ans=a+4*s;why=`Each time add ${fmt(s)}.`;}}
  return {k:'Number pattern',q:`${t.map(x=>fmt(x)).join(', ')}, ?`,a:N(ans),o:dec?decOpts(ans):numOpts(ans,Math.abs(t[1]-t[0])||2,[t[3]+(t[1]-t[0])*2]),why};},

  if(t==='eo'){const n=rand(1,{2:99,3:999,4:9999,5:99999}[c]);return {k:'Even or odd',q:`Is ${fmt(n)} even or odd?`,a:n%2?'Odd':'Even',o:['Even','Odd'],why:`Look at the last digit: ${n%10}. ${n%2?'1, 3, 5, 7, 9 are odd':'0, 2, 4, 6, 8 are even'}.`};}

  const k=rand(4,15),sq=k*k,non=[];for(let i=sq-10;i<sq+10;i++)if(i>1&&!isSquare(i))non.push(i);
  return {k:'Square numbers',q:'Which one is a square number?',a:N(sq),o:shuffle([N(sq)].concat(shuffle(non).slice(0,3).map(N))),why:`${k} × ${k} = ${sq}.`};},
round(c){const p=c===4?pick([10,100]):pick([100,1000,10000]);let n;do{n=rand(p+1,p*(c===4?99:90));}while(n%p===0);

};

function drawNum(){
  const c=S.cls,n=S.num,ds=String(n).split('');
  const pv=ds.map((d,i)=>{const p=ds.length-1-i;return `<div><span>${PLACES[p]}</span><b>${d}</b><em>${fmt(+d*10**p)}</em></div>`;}).join('');
  const b=(ok,t)=>`<span class="badge ${ok?'yes':'no'}">${t}</span>`;
  let badges=b(n>=1,'Natural')+b(true,'Whole')+b(n%2===0,'Even')+b(n%2===1,'Odd');
  if(c>=4)badges+=n<2?`<span class="badge info">${n} is neither prime nor composite</span>`:b(true,isPrime(n)?'Prime':'Composite');
  if(c>=5&&n>0&&isSquare(n))badges+=b(true,`Square of ${Math.round(Math.sqrt(n))}`);
  const f=[];
  f.push(`Comes before: <b>${n>0?fmt(n-1):'— (0 is the smallest whole number)'}</b> &nbsp; Comes after: <b>${fmt(n+1)}</b>`);
  f.push(`10 more: <b>${fmt(n+10)}</b> &nbsp; 10 less: <b>${n>=10?fmt(n-10):'—'}</b>${c>=3?` &nbsp; 100 more: <b>${fmt(n+100)}</b>`:''}`);

    if(n>0)f.push(`Multiples: <b>${[1,2,3,4,5].map(k=>fmt(n*k)).join(', ')} …</b>`);

    <ul class="facts">${f.map(x=>`<li>${x}</li>`).join('')}</ul>${table}`;

/* ---------- builder (shared) ---------- */
function builder(root, target, cls, onDone){
  const tiles=shuffleNew(target).map(t=>({t})); let placed=[]; let locked=false;
  function draw(){ root.innerHTML=`<div class="slots ${cls}">${target.map((_,k)=>placed[k]==null?`<button class="slot empty" disabled aria-label="Empty space"></button>`:`<button class="slot full" data-k="${k}" aria-label="Remove ${esc(tiles[placed[k]].t)}">${esc(tiles[placed[k]].t)}</button>`).join('')}</div>
    <div class="tiles ${cls}">${tiles.map((x,j)=>`<button class="tile" data-j="${j}" ${placed.includes(j)?'disabled':''}>${esc(x.t)}</button>`).join('')}</div>`; }
  root.onclick=e=>{ if(locked) return; const b=e.target.closest('button'); if(!b||b.disabled) return;
    if(b.dataset.j!=null){ placed.push(+b.dataset.j); draw(); if(placed.length===target.length) check(); }
    else if(b.dataset.k!=null){ placed.splice(+b.dataset.k,1); draw(); } };
  function check(){ const ok=placed.every((j,k)=>tiles[j].t===target[k]);
    if(ok){ locked=true; root.classList.add('solved'); }
    else { root.classList.remove('shake'); void root.offsetWidth; root.classList.add('shake'); }
    onDone(ok, ()=>{placed=[];draw();}); }
  root.classList.remove('solved'); draw();
}

let FCH=null;
function renderFractions(){const c=S.cls;if(!FD[c].includes(S.fd)){S.fd=FD[c][FD[c].length-1]>=4?4:2;}if(S.fOn.length!==S.fd)S.fOn=Array(S.fd).fill(false);
  $('#panel').innerHTML=`<div class="grid2">
   <section class="card"><h2>Fraction Lab</h2><p class="hint">Cut the shape into equal parts, then tap parts to colour them.</p>

  $('#fdC').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.fd=+b.dataset.d;S.fOn=Array(S.fd).fill(false);renderFractions();};

function drawBuild(){const c=S.cls,d=S.fd,n=S.fOn.filter(Boolean).length;$('#fBuild').innerHTML=shapeSVG(d,S.fOn,S.fShape);

/* ---------- MATHS: clock ---------- */
const pad=m=>String(m).padStart(2,'0');
const tLabel=(h,m)=>`${h}:${pad(m)}`;
function wordTime(h,m){const nx=h%12+1;if(m===0)return `${h} o'clock`;if(m===30)return `half past ${h}`;if(m===15)return `quarter past ${h}`;if(m===45)return `quarter to ${nx}`;return tLabel(h,m);}
const h12=h=>((h+11)%12)+1;
function ampm(t){t=((t%1440)+1440)%1440;const H=Math.floor(t/60),m=t%60;return `${h12(H)}:${pad(m)} ${H<12?'am':'pm'}`;}
function durLabel(d){const h=Math.floor(d/60),m=d%60;return (h?`${h} hr`:'')+(h&&m?' ':'')+(m?`${m} min`:'');}
function clockSVG(h,m,size,label){const ha=((h%12)+m/60)*30,ma=m*6;let s=`<svg class="clock" viewBox="0 0 200 200" width="${size||200}" style="max-width:100%"><circle class="face" cx="100" cy="100" r="94"/>`;
  for(let i=0;i<60;i++){const a=i*6*Math.PI/180,big=i%5===0,r1=big?80:85;s+=`<line class="tk ${big?'big':''}" x1="${(100+r1*Math.sin(a)).toFixed(1)}" y1="${(100-r1*Math.cos(a)).toFixed(1)}" x2="${(100+90*Math.sin(a)).toFixed(1)}" y2="${(100-90*Math.cos(a)).toFixed(1)}"/>`;}
  for(let n=1;n<=12;n++){const a=n*30*Math.PI/180;s+=`<text x="${(100+66*Math.sin(a)).toFixed(1)}" y="${(100-66*Math.cos(a)).toFixed(1)}">${n}</text>`;}
  s+=`<line class="hh" x1="100" y1="100" x2="100" y2="58" transform="rotate(${ha.toFixed(1)} 100 100)"/><line class="mh" x1="100" y1="100" x2="100" y2="28" transform="rotate(${ma} 100 100)"/><circle class="dot" cx="100" cy="100" r="6"/></svg>`;
  return label?`<figure class="clockfig">${s}<figcaption>${label}</figcaption></figure>`:s;}
function genClock(c){const r=Math.random();
  const readQ=(h,m,lab)=>{const words=lab===wordTime,prev=h===1?12:h-1,nxt=h%12+1;const cs=[lab(nxt,m),lab(prev,m),lab(h,(m+30)%60),lab(nxt,(m+30)%60)];if(!words){cs.push(lab(h,(m+5)%60));if(m%5===0)cs.push(lab(m/5||12,(h%12)*5));}else if(m===15||m===45)cs.push(lab(h,60-m),lab(nxt,60-m));const c2=shuffle(cs);

    return {clocks:[[h12(Math.floor(s/60)),s%60,'Start'],[h12(Math.floor(e/60)),e%60,'End']],q:`A lesson starts at ${ampm(s)} and ends at ${ampm(e)}. How long is it?`,a:durLabel(d),
      o:strOpts(durLabel(d),shuffle([d+5,d-5,d+60,d-60,d+10].filter(x=>x>0).map(durLabel))),why:`From ${ampm(s)} to ${ampm(e)} is ${durLabel(d)}. Count the hours first, then the minutes.`};}
  if(r<.5){const H=rand(13,23),m=5*rand(0,11),lab=`${H}:${pad(m)}`;
    return {clocks:[[H-12,m]],q:`It is ${H<17?'afternoon':H<20?'evening':'night'}. Write this time in 24-hour form.`,a:lab,o:strOpts(lab,shuffle([`${H-12}:${pad(m)}`,`${H+1>23?H-1:H+1}:${pad(m)}`,`${H}:${pad((m+30)%60)}`,`${H-10}:${pad(m)}`])),why:`After 12 noon, add 12 to the hour: ${H-12} + 12 = ${H}. So ${H}:${pad(m)}.`};}

    o:strOpts(ampm(e),shuffle([ampm(e+60),ampm(e-60),ampm(e+15),ampm(e+720)])),why:`Add the hours, then the minutes: ${ampm(s)} + ${durLabel(d)} = ${ampm(e)}.`};}

function mAddLine(c,a,b){const jumps=[];if(b<100){for(let i=0;i<Math.floor(b/10);i++)jumps.push(10);if(b%10)jumps.push(b%10);}else placeParts(b).forEach(p=>jumps.push(p));

function mAddPart(c,a,b){const L=Math.max(String(a).length,String(b).length),rows=[[`${a} = ${placeParts(a).join(' + ')}`,0],[`${b} = ${placeParts(b).join(' + ')}`,0]];

  const s=steps.length;rows.push([`${sums.join(' + ')} = ${a+b}`,s]);steps.push(`Now add the parts together: ${sums.join(' + ')} = ${a+b}.`);steps.push(`So ${a} + ${b} = ${a+b}.`);

function colAdd(a,b,dp,show){dp=dp||0;const A=digs(a).reverse(),B=digs(b).reverse(),la=Math.max(A.length,dp+1),lb=Math.max(B.length,dp+1),LL=Math.max(la,lb);
  const W=LL+2+(dp?1:0),col=k=>W-1-k-(dp&&k>=dp?1:0),pc=W-1-dp,pn=k=>dp?(k<dp?['hundredths','tenths'][k+2-dp]:PNAME[k-dp]):PNAME[k];

  for(let k=0;k<LL;k++){const x=A[k]||0,y=B[k]||0,t=x+y+c,dg=t%10,nc=Math.floor(t/10),s=steps.length;rs.cells[col(k)]={t:dg,s};
    let txt=`${cap(pn(k))}: ${x} + ${y}${c?` + ${c} carried`:''} = ${t}. Write ${dg}`;
    if(nc){carry.cells[col(k+1)]={t:nc,s};if(k===LL-1){rs.cells[col(k+1)]={t:nc,s};txt+=`, and write the ${nc} in front because nothing is left to add`;}else txt+=`, carry ${nc} to the ${pn(k+1)}`;}

function mAddCol(c,a,b){const r=colAdd(a,b,0,`${fmt(a)} + ${fmt(b)} = ${fmt(a+b)}`);return {problem:`${fmt(a)} + ${fmt(b)} = ?`,...r};}

/* ----- subtraction ----- */
function mSubLine(c,a,b){const jumps=[];for(let i=0;i<Math.floor(b/10);i++)jumps.push(10);if(b%10)jumps.push(b%10);let cur=a;const pts=[{v:a,s:0}],arcs=[],steps=[`Start at ${a}. Jump back ${b}: ${jumps.join(' + ')}.`];

function pickHL(){const g=rand(2,9);let x,y;do{x=rand(2,6);y=rand(2,6);}while(x===y||gcd(x,y)!==1);return [g*x,g*y];}
function primeSplit(n){const out=[];let x=n;while(x>1){let p=2;while(x%p)p++;out.push([x,p,x/p]);x/=p;}return out;}

function mLadder(c,a,b){if(a==null)[a,b]=pickHL();const g=gcd(a,b),L=lcm(a,b);let x=a,y=b;const steps=[`Common division: divide both numbers by a prime that goes into at least one of them. Write the answers underneath.`];

function crumbsHTML(cr){return cr.map(([t,h],i)=>i===cr.length-1||h==null?`<span aria-current="page">${esc(t)}</span>`:`<button data-go="${h}">${esc(t)}</button>`).join('<span class="sep">›</span>');}
function showSub(r){const menu=$('#menu'),acts=$('#acts'),lvl=$('#lvl'),nm=SUBJ_INFO[r.subj][1],base={all:r.all,cls:r.cls,subj:r.subj};$('#zone').hidden=true;
  const cr=[['Home','']];if(r.cls)cr.push([`Class ${r.cls}`,toHash({cls:r.cls})]);cr.push([r.all?`${nm} · all classes`:nm,r.z?toHash(base):null]);if(r.z)cr.push([r.z==='adv'?'Advanced Topics':'Learning Zone',null]);
  $('#crumbs').innerHTML=crumbsHTML(cr);
  if(!r.z){acts.hidden=true;acts.innerHTML='';$('#panel').innerHTML='';menu.hidden=false;const tone=SUBJ_INFO[r.subj][3],TB=r.subj==='maths'?ADV:EADV;
    const nAdv=r.all?[2,3,4,5].reduce((a,c)=>a+Object.keys(TB[c]).length,0):Object.keys(TB[r.cls]).length;
    menu.innerHTML=`<h2>${r.all?`${nm}: Class 2 to 5`:`Class ${r.cls} ${nm}`}</h2>`
      +item(tone,'▶','Learning Zone',`${ACTS[r.subj].length} activities${r.all?' for every class':''}: ${ACTS[r.subj].map(x=>x[1]).join(', ')}`,toHash({...base,z:'learn'}))
      +item(r.subj==='maths'?'leaf':'mango','★','Advanced Topics',`${nAdv} topics${r.all?' from Class 2 to 5':''}, ${r.subj==='maths'?'with step-by-step methods':'with grammar rules step by step'}`,toHash({...base,z:'adv'}));return;}
  menu.hidden=true;menu.innerHTML='';
  if(r.z==='adv'){acts.hidden=true;acts.innerHTML='';renderAdvanced();return;}
  const act=r.act||S.act[r.subj]||ACTS[r.subj][0][0];S.subject=r.subj;S.act[r.subj]=act;
  acts.hidden=false;acts.style.setProperty('--accent',r.subj==='maths'?'var(--sky)':'var(--coral)');
  acts.innerHTML=ACTS[r.subj].map(([k,t])=>`<button data-act="${k}" aria-pressed="${k===act}">${esc(t)}</button>`).join('');
  if(r.all){lvl.hidden=false;lvl.innerHTML=`<span>Class level</span>${[2,3,4,5].map(c=>`<button data-c="${c}" aria-pressed="${c===S.cls}">Class ${c}</button>`).join('')}`;}
  RENDER[act]();}
function show(){clearInterval(window.__spd);KP=null;try{speechSynthesis.cancel();}catch(e){}
  if(route.cls&&route.cls!==S.cls){S.cls=route.cls;save('nac-class',S.cls);S.sayIdx=S.wbIdx=S.sbIdx=0;S.streak=0;S.right=0;S.asked=0;}
  const r=route,menu=$('#menu');$('#navbar').hidden=!r.cls&&!r.all;$('#lvl').hidden=true;$('#zone').hidden=true;
  if(r.subj){showSub(r);try{window.scrollTo(0,0);}catch(e){}return;}
  $('#crumbs').innerHTML=crumbsHTML([['Home',''],...(r.cls?[[`Class ${r.cls}`,null]]:[])]);
  const acts=$('#acts');acts.hidden=true;acts.innerHTML='';$('#panel').innerHTML='';menu.hidden=false;
  if(!r.cls)menu.innerHTML=`<h2>Choose your class</h2>`+[2,3,4,5].map((c,i)=>item(TONE[i],String(c),`Class ${c}`,CLASS_INFO[c],toHash({cls:c}))).join('')+`<h2 class="msec">All classes together</h2>`+['maths','english'].map(k=>{const [ic,t,,tone]=SUBJ_INFO[k];return item(tone,ic,t,k==='maths'?'Maths from Class 2 to 5: Learning Zone and Advanced Topics':'English from Class 2 to 5: Learning Zone and Advanced Topics',toHash({all:true,subj:k}));}).join('');
  else menu.innerHTML=`<h2>Class ${r.cls}: choose a subject</h2>`+['maths','english'].map(k=>{const [ic,t,sub,tone]=SUBJ_INFO[k];return item(tone,ic,t,`Learning Zone and Advanced Topics · ${sub}`,toHash({cls:r.cls,subj:k}));}).join('');
  try{window.scrollTo(0,0);}catch(e){}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(!b||!(b.closest('#menu')||b.closest('#crumbs')))return;go(parseTarget(b.dataset.go));});
$('#backBtn').onclick=()=>go(parent(route));
$('#zone').onclick=e=>{const b=e.target.closest('[data-zone]');if(!b)return;go({cls:route.cls,subj:route.subj,act:b.dataset.zone==='adv'?'advanced':null},true);};
$('#acts').onclick=e=>{const b=e.target.closest('[data-act]');if(!b)return;go({...route,z:'learn',act:b.dataset.act},true);};
$('#lvl').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;S.cls=+b.dataset.c;S.sayIdx=S.wbIdx=S.sbIdx=0;S.streak=0;S.right=0;S.asked=0;show();};
const sb=$('#soundBtn');const drawSound=()=>{sb.textContent=S.sound?'Sound on':'Sound off';sb.setAttribute('aria-pressed',S.sound);};
sb.onclick=()=>{S.sound=!S.sound;save('nac-sound',S.sound);if(!S.sound&&'speechSynthesis' in window)try{speechSynthesis.cancel();}catch(e){}drawSound();};
drawSound();route=parseHash();show();
(function(){const sp=$('#splash');if(!sp)return;const close=()=>{if(sp.hidden)return;sp.classList.add('out');setTimeout(()=>{sp.hidden=true;},350);};
  $('#splashGo').onclick=close;sp.addEventListener('click',e=>{if(e.target===sp)close();});setTimeout(close,2600);})();
})();
</script>

<script>
if('serviceWorker' in navigator && location.protocol==='https:'){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
</body>
